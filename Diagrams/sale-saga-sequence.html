<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS-UTP · Saga de venta</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f5f0;
      --color-ink:     #1c1917;
      --color-muted:   #57534e;
      --color-soft:    #6f6a63;
      --color-accent:  #c2410c;
      --color-accent-tint: rgba(194,65,12,0.08);
      --color-link:    #1e3a5f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1400px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · POS-UTP</p>
    <h1>Saga de venta</h1>
    <p class="subtitle">NewSaleView → Sales :8001 → Stock :8002 · validar → verificar → crear → descontar</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pos-sale-saga-title pos-sale-saga-desc">
        <title id="pos-sale-saga-title">POS-UTP sale saga sequence</title>
        <desc id="pos-sale-saga-desc">Time-ordered sale saga: the frontend posts a sale, Sales validates lines against Stock, discounts stock, then confirms the sale or marks it failed.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c2410c"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e3a5f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f5f0"/>

        <!-- Lifelines -->
        <line x1="220" y1="164" x2="220" y2="636" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="164" x2="640" y2="636" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1060" y1="164" x2="1060" y2="636" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Combined fragment alt -->
        <rect x="208" y="420" width="864" height="208" rx="4" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.22)" stroke-width="1"/>
        <rect x="208" y="420" width="40" height="16" rx="2" fill="#f7f5f0" stroke="rgba(28,25,23,0.22)" stroke-width="1"/>
        <text x="228" y="432" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="220" y="452" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[descuento ok]</text>
        <line x1="216" y1="540" x2="1064" y2="540" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="220" y="552" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[else stock falla]</text>

        <!-- Activation bars -->
        <rect x="636" y="200" width="8" height="412" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
        <rect x="1056" y="264" width="8" height="36" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
        <rect x="1056" y="328" width="8" height="36" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
        <rect x="1056" y="392" width="8" height="96" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>

        <!-- Messages -->
        <!-- m1: POST /sales -->
        <line x1="220" y1="200" x2="640" y2="200" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="398" y="180" width="64" height="12" rx="2" fill="#f7f5f0"/>
        <text x="430" y="189" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /sales</text>

        <!-- self: valida líneas -->
        <path d="M 644,232 H 676 Q 684,232 684,240 V 256 Q 684,264 676,264 H 644" fill="none" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="692" y="240" width="72" height="12" rx="2" fill="#f7f5f0"/>
        <text x="728" y="249" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALIDA LÍNEAS</text>

        <!-- m2: GET product -->
        <line x1="640" y1="264" x2="1060" y2="264" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="818" y="244" width="64" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="253" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET product</text>

        <!-- m3: return product -->
        <line x1="1060" y1="296" x2="640" y2="296" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="830" y="276" width="40" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="285" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 OK</text>

        <!-- m4: GET stock -->
        <line x1="640" y1="328" x2="1060" y2="328" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="824" y="308" width="52" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="317" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET stock</text>

        <!-- m5: return qty -->
        <line x1="1060" y1="360" x2="640" y2="360" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="826" y="340" width="48" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="349" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CANTIDAD</text>

        <!-- m6: PATCH -N -->
        <line x1="640" y1="392" x2="1060" y2="392" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="826" y="372" width="48" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="381" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PATCH -N</text>

        <!-- alt region 1: return + headline confirm -->
        <line x1="1060" y1="484" x2="640" y2="484" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="812" y="464" width="76" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="473" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NUEVA CANTIDAD</text>

        <line x1="640" y1="516" x2="220" y2="516" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="394" y="496" width="72" height="12" rx="2" fill="#f7f5f0"/>
        <text x="430" y="505" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">201 CONFIRMADA</text>

        <!-- alt region 2: error + fail -->
        <line x1="1060" y1="580" x2="640" y2="580" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="828" y="560" width="44" height="12" rx="2" fill="#f7f5f0"/>
        <text x="850" y="569" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">409/502</text>

        <line x1="640" y1="608" x2="220" y2="608" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="394" y="588" width="72" height="12" rx="2" fill="#f7f5f0"/>
        <text x="430" y="597" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VENTA FALLIDA</text>

        <!-- Actors -->
        <!-- Frontend -->
        <rect x="120" y="88" width="200" height="64" rx="5" fill="#f7f5f0"/>
        <rect x="120" y="88" width="200" height="64" rx="5" fill="rgba(87,83,78,0.10)" stroke="#6f6a63" stroke-width="0.9"/>
        <rect x="128" y="96" width="30" height="12" rx="2" fill="transparent" stroke="rgba(111,106,99,0.40)" stroke-width="0.8"/>
        <text x="143" y="105" fill="rgba(111,106,99,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="220" y="128" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">NewSaleView</text>
        <text x="220" y="144" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:5173 · VISTA</text>

        <!-- Sales (focal actor) -->
        <rect x="540" y="88" width="200" height="64" rx="5" fill="#f7f5f0"/>
        <rect x="540" y="88" width="200" height="64" rx="5" fill="rgba(194,65,12,0.08)" stroke="#c2410c" stroke-width="0.9"/>
        <rect x="548" y="96" width="30" height="12" rx="2" fill="transparent" stroke="rgba(194,65,12,0.40)" stroke-width="0.8"/>
        <text x="563" y="105" fill="rgba(194,65,12,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="640" y="128" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sales :8001</text>
        <text x="640" y="144" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ORQUESTA SAGA</text>

        <!-- Stock -->
        <rect x="960" y="88" width="200" height="64" rx="5" fill="#f7f5f0"/>
        <rect x="960" y="88" width="200" height="64" rx="5" fill="#ffffff" stroke="#1c1917" stroke-width="0.9"/>
        <rect x="968" y="96" width="30" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
        <text x="983" y="105" fill="rgba(28,25,23,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="1060" y="128" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stock :8002</text>
        <text x="1060" y="144" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PRODUCTO + QTY</text>

        <!-- Legend strip -->
        <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <text x="40" y="672" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="40" y1="688" x2="90" y2="688" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="98" y="691" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">LLAMADA</text>
        <line x1="260" y1="688" x2="310" y2="688" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="318" y="691" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">RETORNO</text>
        <line x1="500" y1="688" x2="550" y2="688" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="558" y="691" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">ÉXITO</text>
        <rect x="740" y="680" width="56" height="14" rx="2" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.22)" stroke-width="1"/>
        <text x="804" y="691" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FRAGMENTO</text>

      </svg>
    </div>
  </div>
</body>
</html>
