<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS-UTP · Arquitectura del sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f5f0;
      --color-ink:     #1c1917;
      --color-muted:   #57534e;
      --color-soft:    #6f6a63;
      --color-accent:  #c2410c;
      --color-accent-tint: rgba(194,65,12,0.08);
      --color-link:    #1e3a5f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · POS-UTP</p>
    <h1>Arquitectura del sistema</h1>
    <p class="subtitle">Sin API Gateway (YAGNI · ADR-001) · Ventas → Stock por HTTP · 1 Postgres, 2 DBs lógicas</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pos-architecture-title pos-architecture-desc">
        <title id="pos-architecture-title">POS-UTP system architecture</title>
        <desc id="pos-architecture-desc">Architecture snapshot showing the Vite frontend calling Sales and reading the catalog straight from Stock, the sale saga between the two services, and two logical databases on one Postgres instance.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c2410c"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e3a5f"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f5f0"/>

        <!-- Zones (bg layer) -->
        <rect x="32" y="96" width="232" height="272" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="44" y="100" width="72" height="12" rx="2" fill="#f7f5f0"/>
        <text x="80" y="109" fill="#6f6a63" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CLIENTE</text>

        <rect x="280" y="96" width="480" height="272" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="292" y="100" width="76" height="12" rx="2" fill="#f7f5f0"/>
        <text x="330" y="109" fill="#6f6a63" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

        <rect x="280" y="384" width="480" height="128" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <rect x="292" y="388" width="104" height="12" rx="2" fill="#f7f5f0"/>
        <text x="344" y="397" fill="#6f6a63" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DATA · POSTGRESQL</text>

        <!-- Arrows (behind nodes) -->
        <!-- 1. Frontend -> Sales -->
        <line x1="248" y1="240" x2="296" y2="240" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="257" y="220" width="30" height="12" rx="2" fill="#f7f5f0"/>
        <text x="272" y="229" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

        <!-- 2. Sales -> Stock (headline saga path) -->
        <line x1="496" y1="240" x2="544" y2="240" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="505" y="220" width="30" height="12" rx="2" fill="#f7f5f0"/>
        <text x="520" y="229" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAGA</text>

        <!-- 3. Frontend -> Stock direct catalog read (dashed, secondary) -->
        <path d="M 148,200 V 148 Q 148,140 156,140 H 636 Q 644,140 644,148 V 200" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="358" y="120" width="76" height="12" rx="2" fill="#f7f5f0"/>
        <text x="396" y="129" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LEE CATÁLOGO</text>

        <!-- 4. Sales -> ventas_db -->
        <line x1="396" y1="280" x2="396" y2="416" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="404" y="334" width="28" height="12" rx="2" fill="#f7f5f0"/>
        <text x="418" y="343" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

        <!-- 5. Stock -> stock_db -->
        <line x1="644" y1="280" x2="644" y2="416" stroke="#57534e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="652" y="334" width="28" height="12" rx="2" fill="#f7f5f0"/>
        <text x="666" y="343" fill="#6f6a63" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

        <!-- Nodes -->
        <!-- Frontend (input) -->
        <rect x="48" y="200" width="200" height="80" rx="5" fill="#f7f5f0"/>
        <rect x="48" y="200" width="200" height="80" rx="5" fill="rgba(87,83,78,0.10)" stroke="#6f6a63" stroke-width="0.9"/>
        <rect x="56" y="208" width="30" height="12" rx="2" fill="transparent" stroke="rgba(111,106,99,0.40)" stroke-width="0.8"/>
        <text x="71" y="217" fill="rgba(111,106,99,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="148" y="246" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Frontend Vite</text>
        <text x="148" y="262" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:5173 · REACT</text>

        <!-- Sales (focal) -->
        <rect x="296" y="200" width="200" height="80" rx="5" fill="#f7f5f0"/>
        <rect x="296" y="200" width="200" height="80" rx="5" fill="rgba(194,65,12,0.08)" stroke="#c2410c" stroke-width="0.9"/>
        <rect x="304" y="208" width="30" height="12" rx="2" fill="transparent" stroke="rgba(194,65,12,0.40)" stroke-width="0.8"/>
        <text x="319" y="217" fill="rgba(194,65,12,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="396" y="246" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sales Service</text>
        <text x="396" y="262" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:8001 · SAGA</text>

        <!-- Stock (backend) -->
        <rect x="544" y="200" width="200" height="80" rx="5" fill="#f7f5f0"/>
        <rect x="544" y="200" width="200" height="80" rx="5" fill="#ffffff" stroke="#1c1917" stroke-width="0.9"/>
        <rect x="552" y="208" width="30" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
        <text x="567" y="217" fill="rgba(28,25,23,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="644" y="246" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stock Service</text>
        <text x="644" y="262" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:8002 · STOCK</text>

        <!-- ventas_db (store) -->
        <rect x="296" y="416" width="200" height="80" rx="5" fill="#f7f5f0"/>
        <rect x="296" y="416" width="200" height="80" rx="5" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.9"/>
        <rect x="304" y="424" width="30" height="12" rx="2" fill="transparent" stroke="rgba(87,83,78,0.40)" stroke-width="0.8"/>
        <text x="319" y="433" fill="rgba(87,83,78,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="396" y="462" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ventas_db</text>
        <text x="396" y="478" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SALES + ITEMS</text>

        <!-- stock_db (store) -->
        <rect x="544" y="416" width="200" height="80" rx="5" fill="#f7f5f0"/>
        <rect x="544" y="416" width="200" height="80" rx="5" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.9"/>
        <rect x="552" y="424" width="30" height="12" rx="2" fill="transparent" stroke="rgba(87,83,78,0.40)" stroke-width="0.8"/>
        <text x="567" y="433" fill="rgba(87,83,78,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="644" y="462" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">stock_db</text>
        <text x="644" y="478" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PRODUCTS + QTY</text>

        <!-- Callout (marginalia, bottom-right) -->
        <text x="928" y="556" fill="#1c1917" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">saga sin orquestador</text>
        <path d="M 862,564 Q 812,516 764,452" fill="none" stroke="rgba(28,25,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="760" cy="452" r="2" fill="#1c1917"/>

        <!-- Legend strip -->
        <line x1="30" y1="532" x2="740" y2="532" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
        <text x="30" y="548" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="30" y1="564" x2="70" y2="564" stroke="#1e3a5f" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="78" y="567" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">HTTP / API</text>
        <line x1="230" y1="564" x2="270" y2="564" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="278" y="567" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">SALE SAGA</text>
        <line x1="420" y1="564" x2="460" y2="564" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="468" y="567" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">LECTURA</text>
        <rect x="600" y="558" width="24" height="12" rx="2" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="0.9"/>
        <text x="632" y="567" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">STORE / DB</text>

      </svg>
    </div>
  </div>
</body>
</html>
