# POS-UTP Fase 3 (ADR-001/002/003/004).
# Sin Docker en la máquina actual: validado vía E2E local (ver infra/e2e_check.py).
# Uso: docker compose -f infra/docker-compose.yml up -d --build
name: pos-utp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  stock:
    build: ../services/stock-service
    environment:
      # POS_ENV=prod desactiva /docs y hace fallar el arranque si quedan los
      # secretos de ejemplo (get_settings los valida).
      POS_ENV: ${POS_ENV:-dev}
      POS_LOG_LEVEL: ${POS_LOG_LEVEL:-INFO}
      STOCK_DATABASE_URL: postgresql+psycopg2://pos:pos@postgres:5432/stock_db
      # JWT_SECRET compartido a propósito: Sales firma el token de servicio que
      # Stock verifica (ADR-008). Dos valores distintos rompen la saga.
      STOCK_JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      STOCK_CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  sales:
    build: ../services/sales-service
    environment:
      POS_ENV: ${POS_ENV:-dev}
      POS_LOG_LEVEL: ${POS_LOG_LEVEL:-INFO}
      SALES_DATABASE_URL: postgresql+psycopg2://pos:pos@postgres:5432/ventas_db
      SALES_STOCK_SERVICE_URL: http://stock:8002
      SALES_JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      SALES_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      SALES_CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
    ports:
      - "8001:8001"
    depends_on:
      stock:
        condition: service_started

volumes:
  pgdata:
